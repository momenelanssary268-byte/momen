name: Candle pattern paper simulator

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: candle-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-trader:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest tests.test_candle_pattern -v
      - name: Run candle pattern paper simulator per coin
        run: |
          set -e
          for symbol in KAITOUSDT ZECUSDT TRUMPUSDT NEARUSDT PEPEUSDT TIAUSDT SUIUSDT; do
            python candle_pattern.py --symbol "$symbol" \
              --start-balance 10 --margin 1 \
              --state "candle_v2_state_${symbol}.json" \
              --report "candle_v2_report_${symbol}.json"
            sleep 2
          done
      - name: Upload detailed reports
        uses: actions/upload-artifact@v4
        with:
          name: candle-v2-reports-${{ github.run_id }}
          path: candle_v2_report_*.json
          retention-days: 30
      - name: Save candle paper state and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candle_v2_state_*.json candle_v2_report_*.json
          git diff --cached --quiet || git commit -m "Update candle pattern paper state and reports (v2)"
          git push origin HEAD:main

