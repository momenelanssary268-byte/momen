
name: Momen AI Trader Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  run-trader:
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run AI Trader
        run: python main.py
