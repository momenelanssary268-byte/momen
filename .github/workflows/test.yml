name: Hourly paper simulator

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: paper-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-trader:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Run paper simulator
        run: python main.py
      - name: Upload detailed report
        uses: actions/upload-artifact@v4
        with:
          name: paper-report-${{ github.run_id }}
          path: paper_report.json
          retention-days: 30
      - name: Save paper state and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_state.json paper_report.json
          git diff --cached --quiet || git commit -m "Update paper simulation state and report"
          git push origin HEAD:main
